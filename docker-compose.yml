services:

  # ── Core ──────────────────────────────────────────────────────────────────

  radish-server:
    build: .
    image: radish
    container_name: radish-server
    ports:
      - "9000:9000"
    networks:
      - radish-net
    volumes:
      - radish-data:/app/persistence
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  radish-client:
    image: radish
    command: julia --project=. client_runner.jl radish-server 9000
    depends_on:
      radish-server:
        condition: service_healthy
    networks:
      - radish-net
    stdin_open: true
    tty: true
    profiles:
      - client

  # ── Workload ──────────────────────────────────────────────────────────────

  radish-simulator:
    image: radish
    command: julia --project=. workload_simulator.jl loadrun --host radish-server --port 9000
    depends_on:
      radish-server:
        condition: service_healthy
    networks:
      - radish-net
    profiles:
      - simulator

  # ── Runner: ephemeral container for tests/benchmarks inside Docker ────────
  #    Uses the same image as the server. Mount results dir for output.

  radish-runner:
    image: radish
    working_dir: /app
    networks:
      - radish-net
    volumes:
      - ./benchmarks/results:/app/benchmarks/results
    profiles:
      - runner

  # ── Docs ──────────────────────────────────────────────────────────────────

  radish-docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    image: radish-docs
    container_name: radish-docs
    working_dir: /srv/jekyll
    ports:
      - "4000:4000"
    volumes:
      - ./docs:/srv/jekyll
      - docs-gems:/usr/local/bundle
    profiles:
      - docs

networks:
  radish-net:
    driver: bridge

volumes:
  radish-data:
  docs-gems:
